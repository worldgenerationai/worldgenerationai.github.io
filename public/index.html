<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Legacy shim. Deep links used to arrive as /?/<path> from a redirect in
      404.html; every route is now a real file, so nothing produces those URLs
      any more. This keeps ones already indexed or bookmarked working.
      https://github.com/rafgraph/spa-github-pages (MIT License)
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!--
      These are the defaults. scripts/prerender.mjs replaces them per route at
      build time, so each page ships its own title, description, canonical,
      Open Graph tags and JSON-LD. Edit both if the wording changes.
    -->
    <title>CHAILD | Supporting children's agency</title>
    <meta name="description" content="A UKRI research project defining and designing children's agency in the age of AI">
    <link rel="canonical" href="%PUBLIC_URL%/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CHAILD">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="%PUBLIC_URL%/">
    <meta property="og:title" content="CHAILD | Supporting children's agency">
    <meta property="og:description" content="A UKRI research project defining and designing children's agency in the age of AI">
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="%PUBLIC_URL%/">
    <meta property="twitter:title" content="CHAILD | Supporting children's agency">
    <meta property="twitter:description" content="A UKRI research project defining and designing children's agency in the age of AI">
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png">

    <meta name="msapplication-TileColor" content="#002147">
    <meta name="theme-color" content="#002147" />

    <!-- Customize icons -->
    <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg?v9=chaildmark" color="#002147">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v9=chaildmark">
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v9=chaildmark">
	  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />



    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
